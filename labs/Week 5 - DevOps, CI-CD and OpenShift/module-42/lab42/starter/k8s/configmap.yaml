apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-api-config
  labels:
    app: crm-api
    # TODO(lab42): Add environment / student labels if you want
data:
  # Lab 41 image only loads CRM_DB_* + actuator probes when profile is docker.
  # Do not use k8s / kubernetes — there is no application-k8s.yml in the image.
  SPRING_PROFILES_ACTIVE: "docker"
  SERVER_PORT: "8080"
  # Local k3d → host-published Postgres (Lab 37 compose user crm / change-me):
  CRM_DB_HOST: "host.k3d.internal"
  CRM_DB_PORT: "5432"
  CRM_DB_NAME: "crm_lab42"
  CRM_DB_USER: "crm"
