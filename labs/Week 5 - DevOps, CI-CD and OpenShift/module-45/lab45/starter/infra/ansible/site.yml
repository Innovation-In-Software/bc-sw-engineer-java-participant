---
# Lab 45 — Ansible site sketch (idempotent config for CRM host)
# TODO(lab45): Keep tasks idempotent; second run should report changed=0 where possible.
# OS user is crm — not crm_app. Do not embed DB passwords (Labs 41–44 use Postgres user crm).

- name: Northstar CRM host baseline
  hosts: crm
  become: true
  gather_facts: true
  vars:
    crm_user: crm
  tasks:
    - name: Ensure crm group exists
      ansible.builtin.group:
        name: "{{ crm_user }}"
        state: present

    - name: Ensure crm user exists
      ansible.builtin.user:
        name: "{{ crm_user }}"
        group: "{{ crm_user }}"
        state: present
        create_home: true

    - name: Placeholder — document package installs
      ansible.builtin.debug:
        msg: "TODO(lab45): Install Temurin JRE 21 per instructor baseline; keep the task idempotent"
