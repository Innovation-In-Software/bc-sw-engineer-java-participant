server.port: 8080
spring.application.name: lab21-crm
management:
  endpoints:
    web:
      exposure:
        # LAB-ONLY — production must authenticate / firewall / allow-list Actuator
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,crmReadinessIndicator
  metrics:
    tags:
      application: northstar-crm
